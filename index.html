<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top Level School — расписание уроков</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #fbf7ec;
        --paper-line: #e7dfc9;
        --ink: #2b2a4c;
        --ink-soft: #6b6a8a;
        --accent: #ff5d73;
        --gold: #f4b740;

        --mon: #ffb4a2;
        --tue: #ffd6a5;
        --wed: #fce38a;
        --thu: #b9e6a5;
        --fri: #a0dde6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(var(--paper-line) 1px, transparent 1px);
        background-size: 100% 42px;
        background-color: var(--paper);
        font-family: "Nunito", sans-serif;
        color: var(--ink);
        min-height: 100vh;
        padding-bottom: 60px;
      }

      .brand-mark {
        font-family: "Baloo 2", sans-serif;
        font-weight: 800;
      }

      .topbar {
        background: var(--ink);
        color: #fff;
        padding: 14px 0;
      }
      .topbar .brand-mark {
        font-size: 1.3rem;
        letter-spacing: 0.3px;
      }
      .topbar .brand-mark span {
        color: var(--gold);
      }
      .topbar small {
        color: rgba(255, 255, 255, 0.55);
        font-weight: 700;
      }

      .hero {
        padding: 40px 0 20px;
      }
      .hero .eyebrow-date {
        font-size: 1rem;
        color: var(--ink-soft);
        font-weight: 700;
        margin-bottom: 4px;
      }
      .hero h1 {
        font-family: "Baloo 2", sans-serif;
        font-weight: 800;
        font-size: clamp(1.9rem, 4.6vw, 2.9rem);
        line-height: 1.08;
        margin-bottom: 8px;
      }
      .hero .today-underline {
        text-decoration: underline;
        text-decoration-color: var(--wed);
        text-decoration-thickness: 10px;
        text-underline-offset: -4px;
        text-decoration-skip-ink: none;
        position: relative;
        z-index: 1;
      }
      .hero p.lead-text {
        color: var(--ink-soft);
        font-size: 1.02rem;
        max-width: 600px;
      }

      .mode-toggle {
        display: inline-flex;
        border: 2px solid var(--ink);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 18px;
      }
      .mode-btn {
        font-family: "Baloo 2", sans-serif;
        font-weight: 700;
        font-size: 0.9rem;
        padding: 9px 18px;
        background: #fff;
        color: var(--ink);
        border: none;
      }
      .mode-btn + .mode-btn {
        border-left: 2px solid var(--ink);
      }
      .mode-btn.active {
        background: var(--ink);
        color: #fff;
      }

      .class-picker {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 4px 0 8px;
      }
      .class-btn {
        font-family: "Baloo 2", sans-serif;
        font-weight: 700;
        min-width: 52px;
        height: 46px;
        padding: 0 10px;
        border-radius: 12px;
        border: 2px solid var(--ink);
        background: #fff;
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        transition:
          transform 0.12s ease,
          background 0.12s ease,
          color 0.12s ease;
      }
      .class-btn:hover {
        transform: translateY(-2px);
      }
      .class-btn.active {
        background: var(--ink);
        color: #fff;
      }
      .class-picker-label {
        font-weight: 800;
        font-family: "Baloo 2", sans-serif;
        color: var(--ink-soft);
        font-size: 0.95rem;
        align-self: center;
        margin-right: 6px;
      }

      .subject-picker-wrap {
        margin: 4px 0 8px;
      }
      .subject-search {
        max-width: 360px;
        border: 2px solid var(--ink);
        border-radius: 12px;
        padding: 9px 14px;
        font-family: "Nunito", sans-serif;
        font-weight: 700;
        font-size: 0.92rem;
        background: #fff;
        margin-bottom: 10px;
      }
      .subject-search:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(244, 183, 64, 0.5);
      }
      .subject-picker {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        max-height: 130px;
        overflow-y: auto;
        padding: 2px 0 10px;
      }
      .subject-btn {
        font-family: "Nunito", sans-serif;
        font-weight: 700;
        font-size: 0.84rem;
        padding: 7px 13px;
        border-radius: 999px;
        border: 2px solid var(--ink);
        background: #fff;
        color: var(--ink);
        white-space: nowrap;
      }
      .subject-btn.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .subject-btn:hover {
        transform: translateY(-1px);
      }

      .teacher-strip {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #fff;
        border: 2px solid var(--ink);
        border-radius: 14px;
        padding: 12px 16px;
        margin: 18px 0 26px;
        box-shadow: 4px 4px 0 var(--ink);
        max-width: 640px;
      }
      .teacher-avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--gold);
        border: 2px solid var(--ink);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Baloo 2", sans-serif;
        font-weight: 800;
        font-size: 1.1rem;
      }
      .teacher-strip .t-name {
        font-weight: 800;
        font-size: 0.95rem;
      }
      .teacher-strip .t-role {
        color: var(--ink-soft);
        font-size: 0.8rem;
        font-weight: 700;
      }
      .teacher-strip .t-phone {
        margin-left: auto;
        font-weight: 800;
        font-size: 0.88rem;
        white-space: nowrap;
        text-decoration: none;
        color: var(--ink);
        border: 2px solid var(--ink);
        border-radius: 999px;
        padding: 6px 12px;
      }
      .teacher-strip .t-phone:hover {
        background: var(--ink);
        color: #fff;
      }

      .subject-summary {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #fff;
        border: 2px solid var(--ink);
        border-radius: 14px;
        padding: 12px 16px;
        margin: 18px 0 26px;
        box-shadow: 4px 4px 0 var(--accent);
        max-width: 640px;
      }
      .subject-summary .s-badge {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Baloo 2", sans-serif;
        font-weight: 800;
        font-size: 1.1rem;
      }
      .subject-summary .s-name {
        font-weight: 800;
        font-size: 0.98rem;
      }
      .subject-summary .s-count {
        color: var(--ink-soft);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        margin: 4px 0 26px;
        font-size: 0.86rem;
        color: var(--ink-soft);
        font-weight: 700;
      }
      .legend .dot {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 3px;
        margin-right: 6px;
        vertical-align: -1px;
        border: 1.5px solid rgba(0, 0, 0, 0.15);
      }

      .day-card {
        border-radius: 18px;
        border: 2px solid var(--ink);
        background: #fff;
        overflow: hidden;
        height: 100%;
        box-shadow: 5px 5px 0 var(--ink);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .day-card.is-today {
        transform: translateY(-6px) scale(1.015);
        box-shadow: 7px 7px 0 var(--ink);
      }
      .day-head {
        padding: 14px 16px 12px;
        font-family: "Baloo 2", sans-serif;
        font-weight: 800;
        font-size: 1.1rem;
        border-bottom: 2px solid var(--ink);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .today-pill {
        font-family: "Nunito", sans-serif;
        font-size: 0.66rem;
        font-weight: 800;
        background: var(--ink);
        color: #fff;
        padding: 3px 9px;
        border-radius: 999px;
        letter-spacing: 0.3px;
      }

      .lesson-list {
        list-style: none;
        margin: 0;
        padding: 8px 0;
      }
      .lesson-item {
        display: flex;
        gap: 10px;
        padding: 8px 16px;
        align-items: baseline;
        border-bottom: 1px dashed rgba(43, 42, 76, 0.15);
      }
      .lesson-item:last-child {
        border-bottom: none;
      }
      .lesson-num {
        font-family: "Baloo 2", sans-serif;
        font-weight: 700;
        color: var(--ink-soft);
        font-size: 0.82rem;
        width: 16px;
        flex-shrink: 0;
      }
      .lesson-time {
        font-size: 0.7rem;
        color: var(--ink-soft);
        font-weight: 700;
        width: 78px;
        flex-shrink: 0;
      }
      .lesson-name {
        font-weight: 700;
        font-size: 0.88rem;
      }
      .lesson-item.is-break {
        background: rgba(43, 42, 76, 0.045);
        font-style: italic;
      }
      .lesson-item.is-break .lesson-name {
        color: var(--ink-soft);
        font-weight: 700;
      }
      .lesson-item.is-subject-hit {
        background: rgba(255, 93, 115, 0.08);
      }
      .lesson-item.is-subject-hit .lesson-name {
        color: var(--accent);
        font-weight: 800;
      }
      .class-chip {
        display: inline-block;
        font-family: "Baloo 2", sans-serif;
        font-weight: 800;
        font-size: 0.75rem;
        background: var(--ink);
        color: #fff;
        border-radius: 7px;
        padding: 2px 7px;
        margin-right: 6px;
      }

      .day-card.is-today .lesson-item {
        border-bottom-color: rgba(43, 42, 76, 0.25);
      }
      .day-card.is-today .lesson-name {
        font-weight: 800;
      }

      .empty-note {
        padding: 20px 16px;
        color: var(--ink-soft);
        font-weight: 700;
        font-size: 0.88rem;
      }

      footer.site-footer {
        text-align: center;
        color: var(--ink-soft);
        font-size: 0.85rem;
        font-weight: 600;
        margin-top: 34px;
      }

      @media (max-width: 767px) {
        .day-card.is-today {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div
        class="container d-flex align-items-center justify-content-between flex-wrap gap-1"
      >
        <span class="brand-mark">Top Level <span>School</span></span>
        <small>Дневник уроков</small>
      </div>
    </div>

    <div class="container hero">
      <div class="eyebrow-date" id="fullDateLabel">—</div>
      <h1>
        Расписание на
        <span class="today-underline" id="todayNameLabel">сегодня</span>
      </h1>
      <p class="lead-text" id="leadText">
        Выберите класс — дневник покажет всю учебную неделю. День, в котором вы
        сейчас находитесь, выделен своим цветом и виден сразу.
      </p>

      <div class="mode-toggle" id="modeToggle">
        <button type="button" class="mode-btn active" data-mode="class">
          По классам
        </button>
        <button type="button" class="mode-btn" data-mode="subject">
          По предмету (для учителя)
        </button>
      </div>

      <div class="class-picker mt-2" id="classPicker">
        <span class="class-picker-label">Класс:</span>
      </div>

      <div class="subject-picker-wrap" id="subjectPickerWrap" style="display: none">
        <input
          type="text"
          class="subject-search"
          id="subjectSearch"
          placeholder="Начните вводить предмет, например: Информатика…"
        />
        <div class="subject-picker" id="subjectPicker"></div>
      </div>

      <div class="teacher-strip" id="teacherStrip" style="display: none">
        <div class="teacher-avatar" id="teacherAvatar">?</div>
        <div>
          <div class="t-name" id="teacherName">—</div>
          <div class="t-role" id="teacherRole">—</div>
        </div>
        <a href="#" class="t-phone" id="teacherPhone" style="display: none"></a>
      </div>

      <div class="subject-summary" id="subjectSummary" style="display: none">
        <div class="s-badge" id="subjectBadge">?</div>
        <div>
          <div class="s-name" id="subjectName">—</div>
          <div class="s-count" id="subjectCount">—</div>
        </div>
      </div>

      <div class="legend" id="legend"></div>

      <div class="row g-3" id="scheduleGrid"></div>

      <footer class="site-footer" id="siteFooter">
        Нажмите на класс наверху, чтобы посмотреть его расписание.
      </footer>
    </div>

        // ---- Индекс "предмет -> где и когда" (строится один раз из SCHEDULE) ----
        // subjectIndex[subject][dayKey] = [{ time, num, cls }, ...] отсортировано по времени
        const subjectIndex = {};
        DAY_KEYS.forEach(function (dayKey) {
          const dayData = SCHEDULE[dayKey] || {};
          CLASS_ORDER.forEach(function (cls) {
            const lessons = dayData[cls] || [];
            lessons.forEach(function (item) {
              // пропускаем перерывы и режимные моменты (__BREAK__, __MEAL__:...)
              if (item.subject.indexOf("__") === 0) return;
              if (!subjectIndex[item.subject]) {
                subjectIndex[item.subject] = {};
                DAY_KEYS.forEach((d) => (subjectIndex[item.subject][d] = []));
              }
              subjectIndex[item.subject][dayKey].push({
                time: item.time,
                num: item.num,
                cls: cls,
              });
            });
          });
        });
        DAY_KEYS.forEach(function (dayKey) {
          Object.keys(subjectIndex).forEach(function (subj) {
            subjectIndex[subj][dayKey].sort(function (a, b) {
              return a.time.localeCompare(b.time);
            });
          });
        });
        const SUBJECT_LIST = Object.keys(subjectIndex).sort(function (a, b) {
          return a.localeCompare(b, "ru");
        });

        function subjectTotalCount(subj) {
          let n = 0;
          DAY_KEYS.forEach(function (d) {
            n += subjectIndex[subj][d].length;
          });
          return n;
        }

        function renderLegend(todayKey) {
          const legend = document.getElementById("legend");
          legend.innerHTML = "";
          DAY_KEYS.forEach(function (k) {
            const dot = document.createElement("span");
            dot.innerHTML =
              '<span class="dot" style="background:' +
              DAY_COLOR[k] +
              '"></span>' +
              DAY_LABEL[k] +
              (k === todayKey ? " — сегодня" : "");
            legend.appendChild(dot);
          });
        }

        function renderClassPicker(activeCls, onPick) {
          const picker = document.getElementById("classPicker");
          picker.querySelectorAll(".class-btn").forEach((b) => b.remove());
          CLASS_ORDER.forEach(function (cls) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "class-btn" + (cls === activeCls ? " active" : "");
            btn.textContent = cls;
            btn.setAttribute(
              "aria-label",
              cls === "0" ? "Нулевой класс" : cls + " класс",
            );
            btn.addEventListener("click", function () {
              onPick(cls);
            });
            picker.appendChild(btn);
          });
        }

        function renderSubjectPicker(activeSubject, onPick, filterText) {
          const picker = document.getElementById("subjectPicker");
          picker.innerHTML = "";
          const q = (filterText || "").trim().toLowerCase();
          const list = q
            ? SUBJECT_LIST.filter((s) => s.toLowerCase().includes(q))
            : SUBJECT_LIST;
          if (list.length === 0) {
            const none = document.createElement("div");
            none.className = "empty-note";
            none.style.padding = "6px 2px";
            none.textContent = "Ничего не найдено";
            picker.appendChild(none);
            return;
          }
          list.forEach(function (subj) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className =
              "subject-btn" + (subj === activeSubject ? " active" : "");
            btn.textContent = subj;
            btn.addEventListener("click", function () {
              onPick(subj);
            });
            picker.appendChild(btn);
          });
        }

        function renderTeacher(cls) {
          const strip = document.getElementById("teacherStrip");
          const info = TEACHERS[cls];
          if (!info || !info.name) {
            strip.style.display = "none";
            return;
          }
          strip.style.display = "flex";
          document.getElementById("teacherAvatar").textContent =
            info.name.charAt(0);
          document.getElementById("teacherName").textContent = info.name;
          document.getElementById("teacherRole").textContent = info.role || "";
          const phoneEl = document.getElementById("teacherPhone");
          if (info.phone) {
            phoneEl.style.display = "inline-block";
            phoneEl.textContent = info.phone;
            phoneEl.href = "tel:+998" + info.phone.replace(/-/g, "");
          } else {
            phoneEl.style.display = "none";
          }
        }

        function renderSubjectSummary(subj) {
          const wrap = document.getElementById("subjectSummary");
          if (!subj) {
            wrap.style.display = "none";
            return;
          }
          wrap.style.display = "flex";
          document.getElementById("subjectBadge").textContent = subj.charAt(0);
          document.getElementById("subjectName").textContent = subj;
          const total = subjectTotalCount(subj);
          document.getElementById("subjectCount").textContent =
            total + (total % 10 === 1 && total % 100 !== 11
              ? " урок за неделю"
              : total % 10 >= 2 &&
                  total % 10 <= 4 &&
                  !(total % 100 >= 12 && total % 100 <= 14)
                ? " урока за неделю"
                : " уроков за неделю");
        }

        function renderSchedule(cls, todayKey) {
          const grid = document.getElementById("scheduleGrid");
          grid.innerHTML = "";

          DAY_KEYS.forEach(function (dayKey) {
            const isToday = dayKey === todayKey;
            const col = document.createElement("div");
            col.className = "col-12 col-sm-6 col-lg-4 col-xl-2dot4 col-xxl";
            col.style.flex = "1 1 220px";

            const lessons = (SCHEDULE[dayKey] && SCHEDULE[dayKey][cls]) || [];

            let listHtml = "";
            if (lessons.length === 0) {
              listHtml = '<div class="empty-note">Уроков нет</div>';
            } else {
              listHtml =
                '<ul class="lesson-list">' +
                lessons
                  .map(function (item) {
                    const isMeal = item.subject.indexOf("__MEAL__:") === 0;
                    const isBreak = item.subject === "__BREAK__" || isMeal;
                    const breakLabel = isMeal
                      ? item.subject.slice(9)
                      : "Перерыв";
                    if (isBreak) {
                      return (
                        '<li class="lesson-item is-break">' +
                        '<span class="lesson-num">•</span>' +
                        '<span class="lesson-time">' +
                        item.time +
                        "</span>" +
                        '<span class="lesson-name flex-grow-1">' +
                        breakLabel +
                        "</span>" +
                        "</li>"
                      );
                    }
                    return (
                      '<li class="lesson-item">' +
                      '<span class="lesson-num">' +
                      (item.num !== null ? item.num : "•") +
                      "</span>" +
                      '<span class="lesson-time">' +
                      item.time +
                      "</span>" +
                      '<span class="lesson-name flex-grow-1">' +
                      item.subject +
                      "</span>" +
                      "</li>"
                    );
                  })
                  .join("") +
                "</ul>";
            }

            col.innerHTML =
              '<div class="day-card' +
              (isToday ? " is-today" : "") +
              '">' +
              '<div class="day-head" style="background:' +
              DAY_COLOR[dayKey] +
              '">' +
              "<span>" +
              DAY_LABEL[dayKey] +
              "</span>" +
              (isToday ? '<span class="today-pill">Сегодня</span>' : "") +
              "</div>" +
              listHtml +
              "</div>";

            grid.appendChild(col);
          });
        }

        function renderScheduleBySubject(subj, todayKey) {
          const grid = document.getElementById("scheduleGrid");
          grid.innerHTML = "";

          DAY_KEYS.forEach(function (dayKey) {
            const isToday = dayKey === todayKey;
            const col = document.createElement("div");
            col.className = "col-12 col-sm-6 col-lg-4 col-xl-2dot4 col-xxl";
            col.style.flex = "1 1 220px";

            const hits = (subj && subjectIndex[subj] && subjectIndex[subj][dayKey]) || [];

            let listHtml = "";
            if (hits.length === 0) {
              listHtml = '<div class="empty-note">Нет уроков в этот день</div>';
            } else {
              listHtml =
                '<ul class="lesson-list">' +
                hits
                  .map(function (item) {
                    return (
                      '<li class="lesson-item is-subject-hit">' +
                      '<span class="lesson-num">' +
                      (item.num !== null ? item.num : "•") +
                      "</span>" +
                      '<span class="lesson-time">' +
                      item.time +
                      "</span>" +
                      '<span class="lesson-name flex-grow-1">' +
                      '<span class="class-chip">' + item.cls + "</span>" +
                      "</span>" +
                      "</li>"
                    );
                  })
                  .join("") +
                "</ul>";
            }

            col.innerHTML =
              '<div class="day-card' +
              (isToday ? " is-today" : "") +
              '">' +
              '<div class="day-head" style="background:' +
              DAY_COLOR[dayKey] +
              '">' +
              "<span>" +
              DAY_LABEL[dayKey] +
              "</span>" +
              (isToday ? '<span class="today-pill">Сегодня</span>' : "") +
              "</div>" +
              listHtml +
              "</div>";

            grid.appendChild(col);
          });
        }

        function init() {
          const now = new Date();
          const jsDay = now.getDay(); // 0=Sun..6=Sat
          const todayKey = JS_DAY_TO_KEY[jsDay] || null;

          document.getElementById("todayNameLabel").textContent = todayKey
            ? DAY_LABEL[todayKey].toLowerCase()
            : "выходной";

          const months = [
            "января",
            "февраля",
            "марта",
            "апреля",
            "мая",
            "июня",
            "июля",
            "августа",
            "сентября",
            "октября",
            "ноября",
            "декабря",
          ];
          document.getElementById("fullDateLabel").textContent =
            (todayKey
              ? DAY_LABEL[todayKey]
              : jsDay === 0
                ? "Воскресенье"
                : "Суббота") +
            ", " +
            now.getDate() +
            " " +
            months[now.getMonth()];

          renderLegend(todayKey);

          let mode = "class"; // "class" | "subject"
          let activeClass = "1A";
          let activeSubject = SUBJECT_LIST[0] || null;
          let subjectFilter = "";

          const classPickerEl = document.getElementById("classPicker");
          const subjectWrapEl = document.getElementById("subjectPickerWrap");
          const subjectSearchEl = document.getElementById("subjectSearch");
          const teacherStripEl = document.getElementById("teacherStrip");
          const subjectSummaryEl = document.getElementById("subjectSummary");
          const leadTextEl = document.getElementById("leadText");
          const siteFooterEl = document.getElementById("siteFooter");

          function refreshClassView() {
            renderClassPicker(activeClass, function (cls) {
              activeClass = cls;
              refreshClassView();
            });
            renderTeacher(activeClass);
            renderSchedule(activeClass, todayKey);
          }

          function refreshSubjectView() {
            renderSubjectPicker(
              activeSubject,
              function (subj) {
                activeSubject = subj;
                refreshSubjectView();
              },
              subjectFilter,
            );
            renderSubjectSummary(activeSubject);
            renderScheduleBySubject(activeSubject, todayKey);
          }

          function applyMode() {
            const isClassMode = mode === "class";
            classPickerEl.style.display = isClassMode ? "flex" : "none";
            subjectWrapEl.style.display = isClassMode ? "none" : "block";
            teacherStripEl.style.display =
              isClassMode && TEACHERS[activeClass] && TEACHERS[activeClass].name
                ? "flex"
                : "none";
            subjectSummaryEl.style.display = isClassMode ? "none" : "flex";
            leadTextEl.textContent = isClassMode
              ? "Выберите класс — дневник покажет всю учебную неделю. День, в котором вы сейчас находитесь, выделен своим цветом и виден сразу."
              : "Выберите предмет — увидите все классы, дни и часы, когда этот предмет идёт по расписанию. Удобно для учителей, которые ведут один предмет в разных классах.";
            siteFooterEl.textContent = isClassMode
              ? "Нажмите на класс наверху, чтобы посмотреть его расписание."
              : "Начните вводить название предмета или выберите его из списка.";
            document
              .querySelectorAll(".mode-btn")
              .forEach((b) => b.classList.toggle("active", b.dataset.mode === mode));

            if (isClassMode) {
              refreshClassView();
            } else {
              refreshSubjectView();
            }
          }

          document.querySelectorAll(".mode-btn").forEach(function (btn) {
            btn.addEventListener("click", function () {
              mode = btn.dataset.mode;
              applyMode();
            });
          });

          subjectSearchEl.addEventListener("input", function (e) {
            subjectFilter = e.target.value;
            renderSubjectPicker(
              activeSubject,
              function (subj) {
                activeSubject = subj;
                refreshSubjectView();
              },
              subjectFilter,
            );
          });

          applyMode();
        }

        document.addEventListener("DOMContentLoaded", init);
      })();
    </script>
  </body>
</html>
